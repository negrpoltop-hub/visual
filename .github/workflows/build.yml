name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls -la
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP-архив не найден в корне репозитория"
            exit 1
          fi
          echo "Найден архив: $ZIP"
          unzip -o "$ZIP"
          ls -la prism
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Build
        working-directory: prism
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: prism
          path: prism/build/libs/*.jar
